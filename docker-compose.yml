name: tripguard_mvp

services:
  backend:
    build:
      context: .
    container_name: tripguard-mvp-backend
    env_file:
      - path: .admin.env
        required: true
        format: raw
    restart: unless-stopped
    environment:
      TRIPGUARD_DATABASE_URL: sqlite:////data/tripguard.db
      TRIPGUARD_UPLOADS_DIR: /uploads
      TRIPGUARD_PUBLIC_BASE_URL: ${TRIPGUARD_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      TRIPGUARD_LLM_BASE_URL: http://host.docker.internal:11434
      TRIPGUARD_LLM_MODEL: ${TRIPGUARD_LLM_MODEL:-gemma4:latest}
      TRIPGUARD_LLM_MAX_TOKENS: ${TRIPGUARD_LLM_MAX_TOKENS:-1200}
      TRIPGUARD_REQUEST_TIMEOUT_SECONDS: ${TRIPGUARD_REQUEST_TIMEOUT_SECONDS:-120}
      TRIPGUARD_RAG_ENABLED: "true"
      TRIPGUARD_RAG_EMBEDDING_MODEL: ${TRIPGUARD_RAG_EMBEDDING_MODEL:-nomic-embed-text}
      TRIPGUARD_RAG_PERSIST_DIR: /data/rag
      TRIPGUARD_INGESTION_TEMP_DIR: /tmp/tripguard-ingestion
      TRIPGUARD_INGESTION_MAX_ATTEMPTS: ${TRIPGUARD_INGESTION_MAX_ATTEMPTS:-2}
      TRIPGUARD_MEDIA_PROXY_URL: ${TRIPGUARD_MEDIA_PROXY_URL:-}
      TRIPGUARD_WHISPER_MODEL: ${TRIPGUARD_WHISPER_MODEL:-base}
      TRIPGUARD_WHISPER_DEVICE: ${TRIPGUARD_WHISPER_DEVICE:-cpu}
      TRIPGUARD_WHISPER_COMPUTE_TYPE: ${TRIPGUARD_WHISPER_COMPUTE_TYPE:-int8}
      TRIPGUARD_INGESTION_MAX_UPLOAD_BYTES: ${TRIPGUARD_INGESTION_MAX_UPLOAD_BYTES:-536870912}
    volumes:
      - ./data:/data
      - ./uploads:/uploads
    ports:
      - "${TRIPGUARD_BACKEND_PORT:-18080}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tripguard_mvp_net

networks:
  tripguard_mvp_net:
    name: tripguard_mvp_net
    driver: bridge
