<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/admin.css"><title>POI 抓取与校审 · TripGuard</title>
  <style>
    .poi-tabs{display:flex;gap:8px;margin:24px 0}.poi-tabs button.active{background:#c56245}.poi-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.poi-card{background:#fff;border:1px solid #e8e1d7;border-radius:18px;padding:22px}.poi-card h2{margin:0 0 18px;font-size:18px}.poi-row{display:flex;gap:10px;align-items:center}.poi-row input,.poi-card textarea,.poi-card select{width:100%;padding:11px;border:1px solid #ddd6ca;border-radius:9px;font:inherit}.poi-card textarea{min-height:120px;resize:vertical}.poi-candidates,.poi-tasks,.poi-attractions{display:grid;gap:9px;margin-top:16px}.poi-option,.poi-item{padding:13px;border:1px solid #e5ddd2;border-radius:10px;cursor:pointer}.poi-option:hover,.poi-option.selected,.poi-item:hover{border-color:#c56245;background:#fff8f4}.poi-option small,.poi-item small{display:block;margin-top:4px;color:#8b877e}.poi-muted{color:#8b877e}.poi-json{width:100%;min-height:420px;padding:14px;background:#20211e;color:#f7f4ed;border:0;border-radius:11px;font:12px/1.6 ui-monospace,monospace}.poi-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between}.poi-actions{display:flex;gap:8px;margin-top:12px}.poi-hidden{display:none}.poi-status{margin:10px 0;color:#8b877e;font-size:13px}.poi-error{color:#b74f43}.poi-pagination{display:flex;gap:8px;margin-top:12px;align-items:center}@media(max-width:900px){.poi-grid{grid-template-columns:1fr}.poi-row{display:grid;grid-template-columns:1fr}.poi-row button{width:100%}}
  </style>
</head>
<body><main class="app-shell">
  <header class="topbar"><a class="brand-lockup" href="/admin"><span class="brand-mark"></span><span>TripGuard</span></a><nav class="app-nav"><a href="/admin">解析任务</a><a href="/admin/sources">解析结果</a><a class="active" href="/admin/poi">POI 抓取</a></nav><form method="post" action="/admin/logout"><button class="text-button" type="submit">退出登录</button></form></header>
  <section class="hero"><div><p class="eyebrow">POI CONTENT CONSOLE</p><h1>景点抓取与内容校审</h1><p>先通过腾讯地图确认 POI，再抓取来源、生成初稿并同步到景点后台。</p></div></section>
  <div class="poi-tabs"><button id="collectTab" type="button">抓取入库</button><button id="reviewTab" class="secondary" type="button">内容校审</button></div>
  <section id="collectView"><div class="poi-grid">
    <article class="poi-card"><h2>1. 查询并选择 POI</h2><div class="poi-row"><input id="keyword" placeholder="例如：故宫、颐和园、象鼻山"><input id="region" placeholder="城市（可选）"><button id="search" type="button">查询 POI</button></div><div id="candidates" class="poi-candidates"><div class="empty">输入地点名称后查询腾讯 POI</div></div></article>
    <article class="poi-card"><h2>2. 提交来源抓取</h2><div id="selected" class="summary"><div><span>已选地点</span><b>尚未选择</b></div><div><span>poiId</span><b>—</b></div></div><textarea id="urls" placeholder="每行一个来源网址，最多 20 个"></textarea><div class="poi-actions"><button id="submitCrawl" type="button" disabled>提交抓取任务</button><button id="refreshTasks" class="secondary" type="button">刷新任务</button></div><div id="taskStatus" class="poi-status"></div></article>
  </div><article class="poi-card" style="margin-top:18px"><div class="poi-toolbar"><h2>抓取任务</h2><span class="poi-muted">任务成功后可生成 JSON 初稿并创建远端景点</span></div><div id="tasks" class="poi-tasks"><div class="empty">暂无任务</div></div></article></section>
  <section id="reviewView" class="poi-hidden"><div class="poi-grid"><article class="poi-card"><div class="poi-toolbar"><h2>远端 POI 列表</h2><button id="refreshAttractions" class="secondary" type="button">刷新</button></div><div id="attractions" class="poi-attractions"><div class="empty">正在读取远端景点</div></div><div class="poi-pagination"><button id="prevPage" class="secondary" type="button" disabled>上一页</button><span id="pageInfo" class="poi-muted">—</span><button id="nextPage" class="secondary" type="button" disabled>下一页</button></div></article><article class="poi-card"><div class="poi-toolbar"><h2>单个 POI 校审</h2><span id="reviewStatus" class="poi-muted">请选择景点</span></div><textarea id="attractionJson" class="poi-json" placeholder="选择远端景点后显示 JSON"></textarea><div class="poi-actions"><button id="saveAttraction" type="button" disabled>保存修改</button></div><div id="reviewLocal" class="poi-status"></div></article></div></section>
</main>
<script>
const apiBase='/admin/poi/api';let selected=null,currentCrawl=null,cursor='',prevCursor='',nextCursor='',currentAttractionId='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const res=await fetch(apiBase+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const body=await res.json().catch(()=>({detail:`HTTP ${res.status}`}));if(!res.ok||body.ok===false)throw Error(body.detail||body.error||`HTTP ${res.status}`);return body.data??body}
function toast(msg){$('taskStatus').textContent=msg}
function showError(target,e){$(target).textContent=e.message||String(e);$(target).className='poi-status poi-error'}
$('collectTab').onclick=()=>{ $('collectView').classList.remove('poi-hidden');$('reviewView').classList.add('poi-hidden');$('collectTab').classList.remove('secondary');$('reviewTab').classList.add('secondary')};
$('reviewTab').onclick=()=>{ $('reviewView').classList.remove('poi-hidden');$('collectView').classList.add('poi-hidden');$('reviewTab').classList.remove('secondary');$('collectTab').classList.add('secondary');loadAttractions()};
$('search').onclick=async()=>{const keyword=$('keyword').value.trim();if(!keyword)return toast('请输入地点名称');$('search').disabled=true;try{const data=await api('/location/suggest',{method:'POST',body:JSON.stringify({keyword,region:$('region').value.trim()})});const list=data.candidates||[];$('candidates').innerHTML=list.length?list.map((p,i)=>`<div class="poi-option" data-index="${i}"><b>${esc(p.name)}</b><small>${esc(p.address)} · ${esc([p.city,p.district].filter(Boolean).join(' · '))}<br>poiId：${esc(p.poiId)}</small></div>`).join(''):'<div class="empty">未查询到有效 POI</div>';document.querySelectorAll('.poi-option').forEach(el=>el.onclick=()=>{selected=list[Number(el.dataset.index)];document.querySelectorAll('.poi-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');$('selected').innerHTML=`<div><span>已选地点</span><b>${esc(selected.name)}</b></div><div><span>poiId</span><b>${esc(selected.poiId)}</b></div>`;$('submitCrawl').disabled=false})}catch(e){showError('taskStatus',e)}finally{$('search').disabled=false}};
$('submitCrawl').onclick=async()=>{if(!selected)return toast('请先选择 POI');const sourceUrls=$('urls').value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,20);if(!sourceUrls.length)return toast('请至少填写一个网址');const poiKey=`tencent_map:${selected.poiId}`;try{const result=await api('/crawls',{method:'POST',body:JSON.stringify({poiProvider:'tencent_map',poiId:String(selected.poiId),poiKey,poi:selected,sourceUrls,idempotencyKey:`poi-crawl:${poiKey}:${[...sourceUrls].sort().join('|')}`,options:{forceRefresh:false,maxPagesPerSource:20,includeImages:true}})});toast('抓取任务已提交');renderTaskResult(result);loadTasks()}catch(e){showError('taskStatus',e)}};
function renderTaskResult(result){const id=result.crawlTaskId||result.task_id||result.taskId||result.data?.crawlTaskId;if(id)currentCrawl=id}
async function loadTasks(){try{const data=await api('/crawls');const list=data.tasks||data.items||data.data?.tasks||[];$('tasks').innerHTML=list.length?list.map(t=>{const id=t.task_id||t.taskId||t.crawlTaskId;return `<div class="poi-item"><b>${esc(t.taskName||t.poiName||t.poiKey||id)}</b><small>${esc(id)} · ${esc(t.status||'未知')} · ${Number(t.page_count||t.pageCount||0)} 页</small><div class="poi-actions"><button type="button" data-draft="${esc(id)}">生成 JSON 初稿</button></div></div>`}).join(''):'<div class="empty">暂无任务</div>';document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>generateDraft(b.dataset.draft))}catch(e){showError('taskStatus',e)}}
async function generateDraft(id){try{const data=await api(`/crawls/${encodeURIComponent(id)}/draft`,{method:'POST'});const raw=JSON.stringify(data.draft||{},null,2);const ok=confirm('JSON 初稿已生成。确认调用 create 接口同步到远端景点后台吗？\n\n'+raw);if(ok){const created=await api(`/crawls/${encodeURIComponent(id)}/create`,{method:'POST',body:JSON.stringify({draft:data.draft})});toast(`已创建远端景点：${created.attractionId||'成功'}`)}}catch(e){showError('taskStatus',e)}}
async function loadAttractions(){try{const data=await api(`/attractions?cursor=${encodeURIComponent(cursor)}&direction=0&page_size=10`);const items=data.items||[];nextCursor=data.next_cursor||'';prevCursor=data.prev_cursor||'';$('attractions').innerHTML=items.length?items.map(x=>`<div class="poi-item" data-attraction="${esc(x.attractionId||x.id||'')}"><b>${esc(x.name||x.attrInfo?.name||'未命名景点')}</b><small>attractionId：${esc(x.attractionId||x.id||'')} · poiId：${esc(x.poiId||x.poi_id||'')}</small></div>`).join(''):'<div class="empty">远端暂无景点</div>';$('pageInfo').textContent=`共 ${data.total_count??items.length} 条`;$('nextPage').disabled=!nextCursor;$('prevPage').disabled=!prevCursor;document.querySelectorAll('[data-attraction]').forEach(el=>el.onclick=()=>loadAttraction(el.dataset.attraction))}catch(e){showError('reviewLocal',e)}}
async function loadAttraction(id){try{const data=await api(`/attractions/${encodeURIComponent(id)}`);currentAttractionId=id;$('attractionJson').value=JSON.stringify(data.attraction||{},null,2);$('saveAttraction').disabled=false;$('reviewStatus').textContent='已加载';$('reviewLocal').textContent=data.local?`关联抓取任务：${data.local.crawlTaskId} · ${data.local.syncStatus}`:'未找到本地抓取关联'}catch(e){showError('reviewLocal',e)}}
$('saveAttraction').onclick=async()=>{try{const value=JSON.parse($('attractionJson').value);const attrInfo=value.attrInfo||value;const baseInfo=value.baseInfo||{};await api(`/attractions/${encodeURIComponent(currentAttractionId)}/update`,{method:'POST',body:JSON.stringify({attrInfo,baseInfo})});$('reviewStatus').textContent='已保存';}catch(e){showError('reviewLocal',e)}};
$('refreshTasks').onclick=loadTasks;$('refreshAttractions').onclick=loadAttractions;$('nextPage').onclick=()=>{cursor=nextCursor;loadAttractions()};$('prevPage').onclick=()=>{cursor=prevCursor;loadAttractions()};loadTasks();
</script></body></html>
