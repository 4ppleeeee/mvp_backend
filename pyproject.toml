[project]
name = "tripguard-mvp-backend"
version = "0.1.0"
description = "MVP backend for the TripGuard travel knowledge base."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.0",
  "pillow>=11.0.0",
  "faster-whisper>=1.1.1",
  "pydantic-settings>=2.10.0",
  "pwdlib[argon2]>=0.3.0",
  "python-multipart>=0.0.20",
  "requests>=2.32.0",
  "sqlmodel>=0.0.24",
  "uvicorn>=0.35.0",
  "youtube-transcript-api>=1.0.0",
  "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "uploads*", "tests*"]
